name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests examples/demo_recovery.py
      - run: uv run ruff format --check src tests examples/demo_recovery.py
      - run: uv run pytest -q -m 'not docker'
      - run: uv run reprolab skills validate src/reprolab/skills
      - run: docker build -t reprolab-python:0.1.0 -f docker/Dockerfile .
      - run: uv run pytest -q -m docker
        env:
          REPROLAB_DOCKER_TESTS: "1"
      - run: uv run reprolab evaluate --suite smoke
