{% extends "base.html" %}{% block content %}<h1>复现任务</h1><p class="muted">{{ runs|length }} 个最近任务</p><table><thead><tr><th>任务与问题</th><th>状态</th><th>创建时间</th></tr></thead><tbody>{% for run in runs %}<tr><td><a href="/runs/{{ run.id }}"><code>{{ run.id }}</code></a><br>{{ run.request }}</td><td><span class="status">{{ run.status }}</span></td><td><small>{{ run.created }}</small></td></tr>{% else %}<tr><td colspan="3">通过 CLI 创建第一个复现任务后，在此查看实验与产物。</td></tr>{% endfor %}</tbody></table>{% endblock %}
