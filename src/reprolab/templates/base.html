<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReproLab</title><style>
:root{color-scheme:light;--ink:#222b29;--muted:#69716c;--paper:#f4f1e9;--line:#d8d8cd;--accent:#315849}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "Instrument Sans",system-ui,sans-serif}header{max-width:1160px;margin:auto;padding:30px 36px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}header a{font-size:26px;font-weight:700;text-decoration:none;letter-spacing:-1px}a{color:var(--accent)}main{max-width:1160px;margin:auto;padding:32px 36px 80px}h1{font-weight:500;font-size:32px;letter-spacing:-1px;line-height:1.4;margin:4px 0 24px}h2{font-size:20px;margin:36px 0 14px}h1,p,small,code{overflow-wrap:anywhere}small,.muted{color:var(--muted)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:16px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:500;color:var(--muted)}pre{background:#eaece4;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 "IBM Plex Mono",monospace;border-radius:5px}code{font-family:"IBM Plex Mono",monospace;font-size:13px}.status{display:inline-block;background:#dde7dd;color:#315849;padding:3px 10px;border-radius:3px;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.card{border-top:2px solid var(--accent);padding-top:14px;margin:10px 0 22px}details{border-bottom:1px solid var(--line);padding:15px 0}summary{cursor:pointer}summary code{margin-right:12px}.meta{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:25px}.timeline{border-left:1px solid var(--line);padding-left:22px}@media(max-width:650px){header,main{padding-left:20px;padding-right:20px}.grid{grid-template-columns:1fr}h1{font-size:25px}td,th{padding:12px 6px}}
</style></head><body><header><a href="/">ReproLab</a><span class="muted">故障复现与回归测试</span></header><main>{% block content %}{% endblock %}</main></body></html>
